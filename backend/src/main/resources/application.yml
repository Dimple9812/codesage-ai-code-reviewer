spring:
  application:
    name: codesage-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/codesage}
    username: ${DATABASE_USERNAME:codesage}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: ${CACHE_TYPE:simple}
    redis:
      time-to-live: 2m
  servlet:
    multipart:
      enabled: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        name: CODESAGE_SESSION
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  level:
    com.codesage: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

codesage:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    # 'repo' is required to read private repositories with an OAuth App. Use 'read:user public_repo' to restrict to public repos.
    scopes: ${GITHUB_OAUTH_SCOPES:read:user,user:email,repo}
    api-url: ${GITHUB_API_URL:https://api.github.com}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    timeout: 20s
  ai:
    provider: ${AI_PROVIDER:anthropic}
    model: ${AI_MODEL:claude-sonnet-5-5}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:}
    timeout: ${AI_TIMEOUT:120s}
    max-retries: ${AI_MAX_RETRIES:3}
    max-schema-retries: ${AI_MAX_SCHEMA_RETRIES:1}
    initial-backoff: 2s
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:8000}
    max-chars-per-request: ${AI_MAX_CHARS_PER_REQUEST:60000}
    max-requests-per-review: ${AI_MAX_REQUESTS_PER_REVIEW:8}
  review:
    max-files: ${REVIEW_MAX_FILES:60}
    max-file-bytes: ${REVIEW_MAX_FILE_BYTES:120000}
    max-total-bytes: ${REVIEW_MAX_TOTAL_BYTES:600000}
    worker-threads: ${REVIEW_WORKER_THREADS:2}
    job-max-attempts: ${REVIEW_JOB_MAX_ATTEMPTS:3}
    stale-job-timeout: 30m
  analysis:
    pmd-enabled: ${ANALYSIS_PMD_ENABLED:true}
    rules-enabled: ${ANALYSIS_RULES_ENABLED:true}
    semgrep-enabled: ${ANALYSIS_SEMGREP_ENABLED:false}
    semgrep-path: ${SEMGREP_PATH:semgrep}
    semgrep-config: ${SEMGREP_CONFIG:p/default}
    semgrep-timeout: 120s
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:120}
    review-creations-per-hour: ${RATE_LIMIT_REVIEWS_PER_HOUR:30}
    backend: ${RATE_LIMIT_BACKEND:memory}

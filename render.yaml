# Render Blueprint: https://render.com/docs/blueprint-spec
# One free web service built from the root Dockerfile (React SPA + Spring Boot API).
# The database is external (e.g. Neon free Postgres) because Render's free Postgres expires after 30 days.
services:
  - type: web
    name: codesage-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: APP_PUBLIC_URL        # https://<your-service>.onrender.com
        sync: false
      - key: APP_FRONTEND_URL      # same as APP_PUBLIC_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: REVIEW_WORKER_THREADS
        value: "1"
      - key: REVIEW_MAX_FILES
        value: "40"

# One command to run CodeSage AI locally:   docker compose up --build
# Configure secrets in .env first (copy .env.example). PostgreSQL and Redis are not published to the host.
name: codesage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codesage
      POSTGRES_USER: codesage
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesage -d codesage"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/codesage
      DATABASE_USERNAME: codesage
      REDIS_HOST: redis
      REDIS_HEALTH_ENABLED: "true"
      CACHE_TYPE: redis
      RATE_LIMIT_BACKEND: redis
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      APP_FRONTEND_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:

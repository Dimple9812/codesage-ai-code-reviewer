# Serves the SPA and reverse-proxies the API so browser, session cookie and CSRF cookie share one origin.
upstream codesage_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://github.com" always;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location ~ ^/(api|oauth2|login/oauth2|swagger-ui|v3/api-docs)(/|$) {
        proxy_pass http://codesage_backend;
        # $http_host keeps the port the browser used (e.g. localhost:3000) so redirects stay on it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
    }

    location = /swagger-ui.html {
        proxy_pass http://codesage_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only the public health probe is proxied; other actuator endpoints are not reachable from outside.
    location = /actuator/health {
        proxy_pass http://codesage_backend;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
